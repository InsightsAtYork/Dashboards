<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Diocesan Dashboards – Parish Overview (Public)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        :root {
            --red: #b31f29;
            --yellow: #f8ce3b;
            --navy: #0d3b66;

            --cream: #faf0c9;
            --gold: #bd8240;

            --bg-1: #f7f8fa;
            --bg-2: #eef1f5;
            --text-dark: #222;
            --glass-bg: rgba(255,255,255,0.6);
            --glass-border: rgba(255,255,255,0.45);
        }

        body {
            margin: 0;
            background: linear-gradient(145deg, var(--bg-1), var(--bg-2));
            font-family: Georgia, serif;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .hero {
            padding: 4rem 1.5rem 3rem;
            text-align: center;
            background: linear-gradient(135deg, var(--navy), var(--red));
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 12s ease-in-out infinite alternate;
        }

        .hero::before {
            width: 300px;
            height: 300px;
            background: var(--yellow);
            top: -60px;
            left: -20px;
        }

        .hero::after {
            width: 280px;
            height: 280px;
            background: var(--red);
            bottom: -40px;
            right: -20px;
            animation-delay: 2s;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-35px); }
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 2;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 1.2rem;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .help-text {
            font-size: 1rem;
            background: var(--cream);
            border-left: 6px solid var(--gold);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.4rem;
        }

        iframe {
            width: 100%;
            height: 75vh;
            border: none;
            border-radius: 12px;
        }

        @media(max-width: 700px) {
            .hero-title { font-size: 2.2rem; }
            iframe { height: 65vh; }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-title">Diocesan Dashboards</div>
        <div class="hero-subtitle">Parish Overview • Public Access</div>
    </section>

    <div class="container">

        <div class="help-text">
            This dashboard is publicly available using Power BI “Publish to web”. 
            It is read‑only and safe to share widely.
        </div>

        <div class="glass-card">
            <iframe title="Parish Overview v2.0"
                src="https://app.powerbi.com/view?r=eyJrIjoiZDIyNWNiMTktY2IyOS00ZmRiLWJlMzYtMjc2MzdkYjlhNWRkIiwidCI6IjMxYmFhNDYwLTE4MTEtNDUyMy04OWRiLTI1N2E2NjY1ODZlNiJ9&embedImagePlaceholder=true&pageName=54144918aabd69f38383"
                allowfullscreen="true">
            </iframe>
        </div>

    </div>

</body>
</html>
